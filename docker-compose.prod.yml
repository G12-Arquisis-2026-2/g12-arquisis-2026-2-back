services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${ECR_REGISTRY:-624005845126.dkr.ecr.us-east-2.amazonaws.com}/energyshark-back-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  connector:
    image: ${ECR_REGISTRY:-624005845126.dkr.ecr.us-east-2.amazonaws.com}/energyshark-back-connector:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ENABLE_PUBLISHER: ${ENABLE_PUBLISHER:-false}
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata: